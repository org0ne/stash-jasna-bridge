#!/usr/sbin/nft -f
# Restrict Jasna (8765, and 8766 when the bridge is configured to run it
# there, e.g. beside a Stash build that spawns its own Jasna on 8765) to localhost; scope the bridge (8770) to who needs it.
# Own table with policy accept, so it adds nothing but these rules to whatever
# else the host allows.
#
# Who reaches 8770 depends on the deployment:
#   - Reverse-proxied (real Stash, Bridge URL "/jasna"): only the proxy host.
#   - Direct mode (plain-HTTP Stash, absolute Bridge URL): the BROWSER talks to
#     the bridge, so any LAN client that opens that Stash needs 8770. Allow the
#     LAN subnet. Jasna's unauthenticated 8765 stays localhost-only regardless.
#
# Apply now:      sudo nft -f deploy/nftables-jasna.conf
# Check:          sudo nft list table inet jasna
# Persist (Debian): sudo mkdir -p /etc/nftables.d && sudo cp deploy/nftables-jasna.conf /etc/nftables.d/
#                   grep -q nftables.d /etc/nftables.conf || echo 'include "/etc/nftables.d/*.conf"' | sudo tee -a /etc/nftables.conf
#                   sudo systemctl enable --now nftables
# Remove:         sudo nft delete table inet jasna

# Idempotent: ensure the table exists, delete it, then recreate — so
# re-running this file replaces the rules instead of appending to them.
table inet jasna
delete table inet jasna

define bridge_clients = {
	192.168.1.10,      # <-- REPLACE: the reverse-proxy host that fronts Stash
	192.168.1.0/24     # <-- REPLACE (or remove): LAN subnet, if browsers reach the bridge without a proxy
}

table inet jasna {
	chain input {
		type filter hook input priority filter; policy accept;
		iifname "lo" accept
		# Jasna itself: never from the network (no auth, opens any path)
		tcp dport { 8765, 8766 } drop
		# bridge
		ip saddr $bridge_clients tcp dport 8770 accept
		tcp dport 8770 drop
	}
}
