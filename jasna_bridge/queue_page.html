<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jasna queue</title>
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --bg: #f4f5f8; --card: #ffffff; --text: #1b1d23; --muted: #6b7180; --line: #e2e5ec;
    --accent: #7c5cff; --ok: #1f9d55; --warn: #d9831f; --bad: #d64545; --run: #2f7de1;
    --chip: #eef0f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15161b; --card: #1f2128; --text: #e8e9ee; --muted: #9a9fae; --line: #2d303a;
      --accent: #bd93f9; --ok: #50fa7b; --warn: #ffb86c; --bad: #ff5555; --run: #8be9fd;
      --chip: #2a2d37;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 16px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
  .meta { color: var(--muted); font-size: 13px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--chip); color: var(--muted); white-space: nowrap; }
  .pill.ok { color: var(--ok); } .pill.run { color: var(--run); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .row { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; }
  .pos { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 1.6em; text-align: right; }
  .title { font-weight: 600; overflow-wrap: anywhere; }
  .title a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); }
  .sub { grid-column: 2 / 4; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .sub b { color: var(--text); font-weight: 600; }
  .sub a.orig { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--muted); }
  .err { grid-column: 2 / 4; color: var(--bad); font-size: 13px; overflow-wrap: anywhere; }
  button { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--chip); color: var(--text); cursor: pointer; }
  button.danger { color: var(--bad); }
  button.primary { color: var(--ok); }
  button:disabled { opacity: .5; cursor: default; }
  a.log { color: var(--muted); font-size: 13px; }
  .running .card { border-color: var(--run); }
  .bar { height: 4px; border-radius: 2px; background: var(--chip); overflow: hidden; margin-top: 8px; grid-column: 1 / 4; }
  .bar i { display: block; height: 100%; width: 0; background: var(--run); transition: width .6s ease; }
  .bar.unknown { background: repeating-linear-gradient(90deg, var(--chip) 0 6px, var(--line) 6px 12px); }
  .sub.prog { font-variant-numeric: tabular-nums; }
  .passes { grid-column: 1 / 4; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center;
    margin-top: 10px; font-size: 13px; }
  .passes .lbl { color: var(--text); font-weight: 600; white-space: nowrap; }
  .passes .lbl span { color: var(--muted); font-weight: 400; }
  .steps { display: flex; gap: 4px; }
  .steps.solo { grid-column: 1 / 3; }
  .steps i { flex: 1; height: 7px; border-radius: 4px; background: var(--chip); overflow: hidden; }
  .steps i b { display: block; height: 100%; width: 0; background: var(--run); transition: width .6s ease; }
  .steps i.done b { opacity: .45; }
  .steps i.now b { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  @media (max-width: 480px) { .passes { grid-template-columns: 1fr; } }
  .empty { color: var(--muted); padding: 6px 2px; }
  /* one block per bridge node */
  .node { margin-bottom: 26px; }
  .node-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 8px; }
  .node-h h2 { margin: 0; font-size: 17px; letter-spacing: 0; text-transform: none; color: var(--text); }
  .node-h .meta { flex-basis: 100%; }
  .node-h .ctl { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .node.paused .card { opacity: .85; }
  .node .h3 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
  .chip { display: inline-block; padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 600; background: var(--chip);
    color: var(--muted); vertical-align: 1px; margin-left: 4px; }
  .gpu { padding: 10px 14px 10px; margin-bottom: 8px; }
  .gpu-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px;
    letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .gpu-h b { color: var(--text); font-size: 15px; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
  .spark-wrap { position: relative; height: 44px; margin: 6px 0 0; }
  .spark { display: block; width: 100%; height: 100%; }
  .spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
  .spark polygon { fill: color-mix(in srgb, var(--accent) 16%, transparent); stroke: none; }
  .spark-wrap .dot { position: absolute; right: 0; width: 6px; height: 6px; margin: -3px -3px 0 0;
    border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--card); }
  .gpu .bar { margin: 6px 0 4px; grid-column: auto; }
  .gpu .bar i { background: var(--accent); }
  .gpu .bar i.w { background: var(--warn); } .gpu .bar i.f { background: var(--bad); }
  .gpu-m { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .jump a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--muted); margin-right: 10px; }
  .more { margin: 2px 0 0; }
  .foot { margin-top: 24px; font-size: 12px; color: var(--muted); }
  .foot a { color: inherit; }
  @media (max-width: 480px) { .row { grid-template-columns: auto 1fr; } .row > button, .row > a.log { grid-column: 2; justify-self: start; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Jasna queue</h1>
    <span id="clock" class="meta"></span>
    <span id="jump" class="meta jump"></span>
  </header>

  <div id="nodes"></div>

  <section>
    <h2>Finished <span id="fcount" class="meta"></span></h2>
    <div id="finished"></div>
  </section>

  <p class="foot" id="foot">stash-jasna-bridge · refreshes every 5 s</p>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const scenes = {};            // scene id -> {title, duration} (from Stash GraphQL, same origin)

  // The bridges shown: "?nodes=name = /jasna; name2 = /jasna-3060" (the
  // jasna-batch plugin's settings link builds this from its node list; a
  // URL may also be absolute when that origin allows this one in its
  // cors_origins). Without it: the bridge serving this page, by relative
  // paths, so any path_prefix works.
  function parseNodes(text) {
    const out = [];
    for (const raw of String(text || "").split(/[;\n]/)) {
      const entry = raw.trim();
      if (!entry) continue;
      let name = "", url = entry;
      const m = entry.match(/^([^=]+?)\s*=\s*(\S.*)$/);
      if (m && !/:\/\/|^\//.test(m[1].trim())) { name = m[1].trim(); url = m[2].trim(); }
      url = url.split(/\s+/)[0].replace(/\/+$/, "");
      if (!/:\/\/|^\//.test(url)) continue;
      out.push({ name: name || url.replace(/^.*\//, "") || "bridge", base: url + "/", key: out.length });
    }
    return out;
  }
  const params = new URLSearchParams(location.search);
  const NODES = parseNodes(params.get("nodes"));
  if (!NODES.length) NODES.push({ name: "", base: "", key: 0 });
  const multi = NODES.length > 1;
  const state = {};             // node key -> {health, jobs, batch, error}
  const QUEUE_FOLD = 5;         // queued jobs shown per node until "show all"
  const expanded = new Set();   // node keys whose whole queue is shown

  const fmtDur = (s) => {
    if (s == null) return "";
    s = Math.round(s);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    return h ? `${h}h ${String(m).padStart(2, "0")}m` : m ? `${m}m ${String(r).padStart(2, "0")}s` : `${r}s`;
  };
  const fmtTime = (epoch) => {
    if (!epoch) return "";
    const d = new Date(epoch * 1000), now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    return sameDay ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
                   : d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  };
  const fmtGB = (b) => (b ? (b / 1e9).toFixed(2) + " GB" : "");
  const base = (j) => (j.stash_source || "").split("/").pop();
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const fmtClock = (s) => {     // a film's length: 2h 02m, 48m
    if (s == null) return "";
    s = Math.round(s);
    const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
    return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m`;
  };
  const duration = (j) => (scenes[j.scene_id] || {}).duration;

  // A done job's title goes to the scene made from its output (the plugin
  // reports it on ack); everything else, and a done job the plugin has not
  // reported on yet, goes to the original. base() names the source file in
  // the detail line either way.
  const resultId = (j) => (j.state === "done" && j.result_scene_id) || null;
  function sceneLink(j) {
    const id = resultId(j) || j.scene_id;
    const t = (scenes[id] || {}).title;
    const label = t ? esc(t) : esc(resultId(j) ? (j.stash_output || "").split("/").pop() : base(j));
    return `<a href="/scenes/${encodeURIComponent(id)}" title="scene ${esc(id)}">${label}</a>`;
  }
  const originalLink = (j) => resultId(j)
    ? ` · <a class="orig" href="/scenes/${encodeURIComponent(j.scene_id)}" title="the scene this job was queued from">original</a>` : "";

  async function api(node, path, opts) {
    const r = await fetch(node.base + path, { credentials: "include", ...opts });
    if (!r.ok) {
      let detail = "";
      try { detail = (await r.json()).error || ""; } catch (e) { /* not JSON */ }
      throw new Error(`${node.name || "bridge"}: HTTP ${r.status}${detail ? " " + detail : ""}`);
    }
    return r.json();
  }
  const post = (node, path, body) => api(node, path, { method: "POST", headers: { "Content-Type": "application/json" },
                                                       body: JSON.stringify(body || {}) });

  async function cancel(key, id, st) {
    const what = st === "running" ? "Stop the running job and discard its progress?" : "Remove this job from the queue?";
    if (!confirm(what)) return;
    try { await api(NODES[key], `jobs/${id}`, { method: "DELETE" }); } catch (e) { alert(e.message); }
    refresh();
  }
  // Pause: finish the running job, start no other. Pause now: also stop the
  // running job and put it back at the head of the queue (Jasna cannot
  // resume a run, so its progress so far is lost) to free the GPU at once.
  async function pause(key, stopRunning) {
    const node = NODES[key], s = state[key] || {}, running = s.batch && s.batch.running;
    if (stopRunning && running && !confirm(`Stop ${running.source || "the running job"} now and put it back at the head of ` +
        `${node.name ? node.name + "'s" : "the"} queue? Its ${fmtDur(running.running_s)} of progress is lost.`)) return;
    try { await post(node, "batch/pause", { stop_running: !!stopRunning }); } catch (e) { alert(e.message); }
    refresh();
  }
  async function resume(key) {
    try { await post(NODES[key], "batch/resume"); } catch (e) { alert(e.message); }
    refresh();
  }
  function showAll(key) { expanded.add(key); $("nodes").innerHTML = NODES.map(renderNode).join(""); }
  window.__cancel = cancel; window.__pause = pause; window.__resume = resume; window.__showAll = showAll;

  // Progress as one bar per pass: finished passes full, the current one
  // filled to Jasna's percent for it, the rest empty. Jasna's own bar
  // restarts for each pass, so this is the honest shape of the run. An LTX
  // job always makes 4 passes (scan, encode, denoise, compose), so an LTX
  // job that has not printed a bar yet already shows 4 empty segments; a
  // job whose bars carry no pass label gets a single segment.
  const LTX_STAGES = ["scan", "encode", "denoise", "compose"];
  const isLtx = (j) => (j.flags || []).some((f, i, a) => a[i - 1] === "--restoration-model-name" && /^ltx/i.test(f));
  function progressBar(j) {
    const p = j.progress || {};
    const pct = p.percent;
    const total = p.passes || (isLtx(j) ? LTX_STAGES.length : 1);
    const cur = p.pass || (pct != null ? 1 : 0);
    const steps = Array.from({ length: total }, (_, i) => {
      const n = i + 1;
      const fill = n < cur ? 100 : n === cur && pct != null ? pct : 0;
      const name = total === LTX_STAGES.length ? `: ${LTX_STAGES[i]}` : "";
      return `<i class="${n < cur ? "done" : n === cur ? "now" : ""}" title="pass ${n}${name}"><b style="width:${fill}%"></b></i>`;
    }).join("");
    const label = total > 1
      ? (cur ? `Pass ${cur} of ${total}${p.stage ? ` <span>· ${esc(p.stage)}</span>` : ""}` : `${total} passes <span>· preparing</span>`)
      : "";
    const bits = pct == null ? ["progress not reported yet"] : [`${pct}%`];
    if (pct != null) {
      if (p.eta_s != null) bits.push(cur && total > 1 ? `pass ETA ${fmtDur(p.eta_s)}` : `ETA ${fmtDur(p.eta_s)}`);
      if (p.run_left_s != null) bits.push(`${fmtDur(p.run_left_s)} left in all`);
      if (p.rate) bits.push(p.rate);
    }
    return `<span class="passes">${label ? `<span class="lbl">${label}</span>` : ""}<span class="steps${label ? "" : " solo"}">${steps}</span></span>
      <span class="sub prog">${esc(bits.join(" · "))}</span>`;
  }

  function renderJob(node, j, pos) {
    const st = j.state;
    const when = st === "running" ? `started ${fmtTime(j.started)} · running ${fmtDur(j.running_s)}`
               : st === "queued" ? `queued ${fmtTime(j.created)}`
               : `${fmtTime(j.finished)} · ${fmtDur(j.duration_s)}${j.output_bytes ? " · " + fmtGB(j.output_bytes) : ""}`;
    const cls = st === "done" ? "ok" : st === "running" ? "run" : st === "queued" ? "" : st === "failed" ? "bad" : "warn";
    const action = (st === "queued" || st === "running")
      ? `<button class="danger" onclick="__cancel(${node.key},'${j.id}','${st}')">${st === "running" ? "Stop" : "Remove"}</button>`
      : (j.log_file ? `<a class="log" href="${esc(node.base)}jobs/${j.id}/log" target="_blank">log</a>` : "");
    const nodeChip = multi && pos == null && st !== "running" ? `<span class="chip">${esc(node.name)}</span>` : "";
    const head = st === "queued" && j.head ? " · back at the head after a pause" : "";
    return `<div class="card"><div class="row">
      <span class="pos">${pos != null ? pos : `<span class="pill ${cls}">${esc(st)}</span>`}</span>
      <span class="title">${sceneLink(j)}${nodeChip}</span>
      ${action}
      <span class="sub"><b>${esc(j.preset)}</b> · ${esc(base(j))}${duration(j) ? " · " + fmtClock(duration(j)) : ""} · ${esc(when)}${st === "done" && !j.ingested ? " · waiting for Stash to ingest" : ""}${esc(head)}${originalLink(j)}</span>
      ${j.error ? `<span class="err">${esc(j.error)}</span>` : ""}
      ${st === "running" ? progressBar(j) : ""}
    </div></div>`;
  }

  // One aliased findScene per id in a single request: findScenes(ids:) fails
  // the whole query when any scene has since been deleted (a finished job's
  // original, say), while findScene just answers null for that one.
  async function loadScenes(ids) {
    const missing = [...new Set(ids)].filter((id) => /^\d+$/.test(id) && !(id in scenes));
    if (!missing.length) return;
    try {
      const q = "{ " + missing.map((id, i) => `s${i}: findScene(id:"${id}") { title files { duration } }`).join(" ") + " }";
      const r = await fetch("/graphql", {
        method: "POST", credentials: "include", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: q }),
      });
      const d = await r.json();
      missing.forEach((id, i) => {
        const s = d.data && d.data[`s${i}`];
        const f = s ? (s.files || []).find((x) => x && x.duration) || {} : {};
        scenes[id] = s ? { title: s.title || "", duration: f.duration || null } : {};
      });
    } catch (e) { for (const id of missing) scenes[id] = {}; }
  }

  // Whole-GPU load from the bridge's nvidia-smi sampler (health.gpu): a
  // utilization sparkline over the last few minutes, the VRAM bar and the
  // card's name. Empty where the bridge reports no GPU.
  function renderGpu(g) {
    if (!g || !g.mem_total) return "";
    const clamp = (v) => Math.max(0, Math.min(100, v));
    const h = (g.history || []).map(clamp);
    const gb = (m) => (m / 1024).toFixed(1);
    const memPct = Math.round(100 * g.mem_used / g.mem_total);
    const memCls = memPct >= 90 ? "f" : memPct >= 75 ? "w" : "";
    let spark = '<div class="spark-wrap"></div>';
    if (h.length >= 2) {
      const n = h.length;
      const line = h.map((v, i) => `${i},${100 - v}`).join(" ");
      spark = `<div class="spark-wrap">
        <svg class="spark" viewBox="0 0 ${n - 1} 100" preserveAspectRatio="none" aria-hidden="true">
          <polygon points="0,100 ${line} ${n - 1},100"/><polyline points="${line}"/>
        </svg><i class="dot" style="top:${100 - h[n - 1]}%"></i></div>`;
    }
    const span = g.interval_s && h.length > 1 ? `last ${fmtDur(g.interval_s * (h.length - 1))}` : "";
    const title = `${g.name || "GPU"}: ${g.util}% util, ${gb(g.mem_used)} / ${gb(g.mem_total)} GB VRAM` +
      (g.sampled_ago != null ? ` (sampled ${Math.round(g.sampled_ago)}s ago)` : "");
    return `<section class="card gpu" title="${esc(title)}"><div class="gpu-h"><span>GPU ${esc(span)}</span><b>${g.util}%</b></div>${spark}
      <div class="bar"><i class="${memCls}" style="width:${memPct}%"></i></div>
      <div class="gpu-m"><span>${gb(g.mem_used)} / ${gb(g.mem_total)} GB VRAM</span>
        <span>${esc((g.name || "").replace(/^NVIDIA\s+/, ""))}</span></div></section>`;
  }

  // The node's status pill and its Pause / Pause now / Resume buttons.
  function nodeHeader(node, s) {
    const name = node.name ? esc(node.name) : "";
    if (s.error) {
      return `<div class="node-h"><h2>${name || "Bridge"}</h2><span class="pill bad">unreachable</span>
        <span class="meta">${esc(s.error)}</span></div>`;
    }
    const health = s.health || {}, b = health.batch || {}, info = s.batch || {};
    const running = s.jobs.filter((j) => j.state === "running"), queued = s.jobs.filter((j) => j.state === "queued");
    const live = health.active ? "live stream active" : (health.stream && health.stream.path) ? "stream lingering" : "";
    let text, cls;
    if (!b.enabled) { text = "batch disabled"; cls = "bad"; }
    else if (b.paused) { text = running.length ? "paused · finishing the running job" : "paused"; cls = "warn"; }
    else if (running.length) { text = "processing"; cls = "run"; }
    else if (queued.length) { text = live ? `waiting: ${live}` : "waiting for the GPU"; cls = "warn"; }
    else { text = live || "idle"; cls = "ok"; }
    const meta = [];
    if (health.version) meta.push(`bridge ${health.version}`);
    if (info.jasna_version) meta.push(`Jasna ${info.jasna_version}`);
    if (b.scratch_free_gb != null) meta.push(`${Math.round(b.scratch_free_gb)} GB scratch free`);
    if (b.paused && b.paused_since) meta.push(`paused since ${fmtTime(b.paused_since)}`);
    if (live && b.paused) meta.push(live);
    let ctl = "";
    if (b.enabled) {
      ctl = b.paused
        ? `<button class="primary" onclick="__resume(${node.key})" title="Start queued jobs again">Resume</button>`
        : `<button onclick="__pause(${node.key},false)" title="Let the running job finish, then start no other">Pause</button>` +
          (running.length ? `<button class="danger" onclick="__pause(${node.key},true)" title="Stop the running job now (its progress is lost), put it back at the head of the queue, and start no other">Pause now</button>` : "");
    }
    return `<div class="node-h"><h2>${name || "Bridge"}</h2><span class="pill ${cls}">${esc(text)}</span>
      <span class="ctl">${ctl}</span><span class="meta">${esc(meta.join(" · "))}</span></div>`;
  }

  function renderNode(node) {
    const s = state[node.key] || { error: "loading" };
    const paused = !s.error && s.health && s.health.batch && s.health.batch.paused;
    let body = "";
    if (!s.error) {
      const running = s.jobs.filter((j) => j.state === "running"), queued = s.jobs.filter((j) => j.state === "queued");
      const queuedRuntime = queued.reduce((t, j) => t + (duration(j) || 0), 0);
      const fold = multi && !expanded.has(node.key) && queued.length > QUEUE_FOLD + 1;
      const shown = fold ? queued.slice(0, QUEUE_FOLD) : queued, hidden = queued.length - shown.length;
      body = renderGpu((s.health || {}).gpu) +
        `<div class="h3">Running</div><section class="running">${running.length ? running.map((j) => renderJob(node, j)).join("") : `<div class="empty">nothing running</div>`}</section>
         <div class="h3">Queued ${queued.length ? `(${queued.length}${queuedRuntime ? ` · ${fmtClock(queuedRuntime)} of video` : ""})` : ""}</div>
         ${queued.length ? shown.map((j, i) => renderJob(node, j, i + 1)).join("") : `<div class="empty">queue is empty</div>`}
         ${hidden ? `<button class="more" onclick="__showAll(${node.key})">Show all ${queued.length} queued (${hidden} more)</button>` : ""}`;
    }
    return `<section class="node${paused ? " paused" : ""}" id="node-${node.key}">${nodeHeader(node, s)}${body}</section>`;
  }

  async function fetchNode(node) {
    try {
      const [health, list, batch] = await Promise.all([api(node, "health"), api(node, "jobs"), api(node, "batch").catch(() => ({}))]);
      state[node.key] = { health, jobs: list.jobs || [], batch };
    } catch (e) {
      state[node.key] = { error: e.message, jobs: [] };
    }
  }

  async function refresh() {
    await Promise.all(NODES.map(fetchNode));
    const all = NODES.flatMap((n) => (state[n.key].jobs || []).map((j) => [n, j]));
    await loadScenes(all.flatMap(([, j]) => [j.scene_id, resultId(j)].filter(Boolean)));
    $("nodes").innerHTML = NODES.map(renderNode).join("");
    $("jump").innerHTML = multi ? NODES.map((n) => `<a href="#node-${n.key}">${esc(n.name)}</a>`).join("") : "";
    const finished = all.filter(([, j]) => !["running", "queued"].includes(j.state))
      .sort((a, b) => (b[1].finished || 0) - (a[1].finished || 0)).slice(0, 25);
    $("finished").innerHTML = finished.length ? finished.map(([n, j]) => renderJob(n, j)).join("") : `<div class="empty">none yet</div>`;
    $("fcount").textContent = finished.length ? `(last ${finished.length}${multi ? ", all nodes" : ""})` : "";
    $("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    const links = NODES.map((n) => `<a href="${esc(n.base)}jobs">${multi ? esc(n.name) + " " : ""}raw JSON</a> · <a href="${esc(n.base)}health">${multi ? esc(n.name) + " " : ""}health</a>`);
    $("foot").innerHTML = `stash-jasna-bridge · refreshes every 5 s · ${links.join(" · ")}`;
  }

  refresh();
  setInterval(refresh, 5000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
